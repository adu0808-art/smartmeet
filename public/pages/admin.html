<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" style="background:linear-gradient(135deg, #f59e0b, #d97706);">⚙</div>
        <div>
          <div class="brand-name">관리자 콘솔</div>
          <div class="brand-sub">SmartMeet</div>
        </div>
      </div>
      <a href="/dashboard" class="nav-item" style="font-size:12px;color:var(--text-muted);">← 일반 모드</a>
      <div class="nav-section-title">시스템</div>
      <a class="nav-item active" data-page="overview" onclick="switchPage('overview')"><span class="icon">📊</span> 개요</a>
      <a class="nav-item" data-page="users" onclick="switchPage('users')"><span class="icon">👤</span> 사용자 관리</a>
      <a class="nav-item" data-page="organizations" onclick="switchPage('organizations')"><span class="icon">🏛️</span> 기관 관리</a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-title" id="topTitle">시스템 개요</div>
        <div class="topbar-actions" id="userArea"></div>
      </div>
      <div class="content">
        <!-- Overview -->
        <div id="page-overview" class="admin-page">
          <h1 class="page-title mb-16">시스템 개요</h1>
          <div class="grid-cards" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:24px;">
            <div class="card"><div class="text-sm text-muted mb-8">전체 사용자</div><div style="font-size:28px;font-weight:800;" id="s-users">-</div></div>
            <div class="card"><div class="text-sm text-muted mb-8">등록 기관</div><div style="font-size:28px;font-weight:800;" id="s-orgs">-</div></div>
            <div class="card"><div class="text-sm text-muted mb-8">전체 회의</div><div style="font-size:28px;font-weight:800;" id="s-meetings">-</div></div>
            <div class="card"><div class="text-sm text-muted mb-8">전체 의원</div><div style="font-size:28px;font-weight:800;" id="s-members">-</div></div>
            <div class="card"><div class="text-sm text-muted mb-8">위임장 발급</div><div style="font-size:28px;font-weight:800;" id="s-proxies">-</div></div>
            <div class="card"><div class="text-sm text-muted mb-8">위임장 제출</div><div style="font-size:28px;font-weight:800;color:var(--success);" id="s-submitted">-</div></div>
          </div>
          <div class="card">
            <div class="card-title">관리자 안내</div>
            <ul class="text-sm" style="line-height:1.9;color:var(--text-muted);padding-left:18px;">
              <li>사용자 관리에서 권한 변경 및 비밀번호 재설정이 가능합니다.</li>
              <li>기관 관리에서 등록된 모든 기관을 확인하고 진입할 수 있습니다.</li>
              <li>DB는 <code>/DB/smartmeet.db</code>에 저장됩니다.</li>
            </ul>
          </div>
        </div>

        <!-- Users -->
        <div id="page-users" class="admin-page hidden">
          <div class="page-header">
            <div>
              <h1 class="page-title">사용자 관리</h1>
              <div class="page-sub" id="userCount"></div>
            </div>
            <div class="flex gap-8 items-center" style="flex-wrap:wrap;">
              <input class="input" id="userSearch" placeholder="이름·이메일·전화번호·소속 검색" style="width:300px;">
              <button class="btn btn-sm" id="userSearchClear" title="검색어 지우기">✕</button>
            </div>
          </div>
          <div id="usersList"></div>
        </div>

        <!-- Organizations -->
        <div id="page-organizations" class="admin-page hidden">
          <div class="page-header">
            <h1 class="page-title">기관 관리</h1>
            <div class="flex gap-8 items-center">
              <span class="text-sm text-muted" id="orgCount"></span>
              <button class="btn btn-sm" onclick="openSmtpDiag()">📧 SMTP 진단</button>
            </div>
          </div>
          <div id="orgsList"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script>
    let me;
    (async function init() {
      me = await requireAuth();
      if (me.role !== 'admin') { location.href = '/dashboard'; return; }
      document.getElementById('userArea').innerHTML = renderUserChip(me);
      switchPage('overview');
    })();

    function switchPage(p) {
      document.querySelectorAll('.admin-page').forEach(el => el.classList.add('hidden'));
      document.getElementById('page-' + p).classList.remove('hidden');
      document.querySelectorAll('.sidebar .nav-item[data-page]').forEach(n => n.classList.toggle('active', n.dataset.page === p));
      document.getElementById('topTitle').textContent = { overview:'시스템 개요', users:'사용자 관리', organizations:'기관 관리' }[p];
      if (p === 'overview') loadStats();
      else if (p === 'users') loadUsers();
      else if (p === 'organizations') loadOrgs();
    }

    async function loadStats() {
      const s = await api.get('/api/admin/stats');
      document.getElementById('s-users').textContent = s.userCount;
      document.getElementById('s-orgs').textContent = s.orgCount;
      document.getElementById('s-meetings').textContent = s.meetingCount;
      document.getElementById('s-members').textContent = s.memberCount;
      document.getElementById('s-proxies').textContent = s.proxyCount;
      document.getElementById('s-submitted').textContent = s.submittedProxyCount;
    }

    let _allUsers = [];
    let _userSearchQ = '';

    async function loadUsers() {
      const { users } = await api.get('/api/admin/users');
      _allUsers = users;
      // 검색 입력 핸들러 (1회만 바인딩)
      const searchEl = document.getElementById('userSearch');
      const clearEl = document.getElementById('userSearchClear');
      if (searchEl && !searchEl._bound) {
        searchEl._bound = true;
        searchEl.addEventListener('input', () => {
          _userSearchQ = searchEl.value.trim();
          renderUsers();
        });
      }
      if (clearEl && !clearEl._bound) {
        clearEl._bound = true;
        clearEl.onclick = () => { searchEl.value = ''; _userSearchQ = ''; renderUsers(); searchEl.focus(); };
      }
      renderUsers();
    }

    // 검색·렌더 (서버 재요청 없이 클라이언트 필터)
    function renderUsers() {
      const renderOrgs = (orgs) => {
        if (!orgs || !orgs.length) return '<span class="text-sm text-muted">소속 없음</span>';
        return orgs.map(o => {
          const role = o.is_owner ? '🏛 소유자'
                     : (o.member_role === 'admin' ? '🔑 관리자' : '👤 회원');
          return `<div class="text-sm" style="display:flex;align-items:center;gap:6px;margin:2px 0;">
            <span class="fw-700">${escapeHtmlAdmin(o.org_name)}</span>
            <span class="text-muted" style="font-size:11px;">${role}</span>
          </div>`;
        }).join('');
      };
      const normalize = (s) => String(s || '').toLowerCase();
      const normalizePhone = (s) => String(s || '').replace(/\D/g, '');
      const q = normalize(_userSearchQ);
      const qDigits = normalizePhone(_userSearchQ);
      const filtered = _allUsers.filter(u => {
        if (!q) return true;
        if (normalize(u.name).includes(q)) return true;
        if (normalize(u.email).includes(q)) return true;
        if (normalize(u.workplace).includes(q)) return true;
        // 전화번호: 숫자만 비교 (하이픈 무시)
        if (qDigits && normalizePhone(u.phone).includes(qDigits)) return true;
        // 소속 기관 이름도 검색 대상
        if (u.organizations && u.organizations.some(o => normalize(o.org_name).includes(q))) return true;
        return false;
      });
      const total = _allUsers.length;
      const cntEl = document.getElementById('userCount');
      if (cntEl) {
        cntEl.textContent = q ? `검색 결과 ${filtered.length}명 / 전체 ${total}명` : `총 ${total}명`;
      }
      document.getElementById('usersList').innerHTML = filtered.length ? `
        <table class="table">
          <thead><tr>
            <th>이름</th>
            <th>이메일</th>
            <th>전화번호</th>
            <th>시스템 권한</th>
            <th>소속 기관</th>
            <th>가입일</th>
            <th style="text-align:right;">작업</th>
          </tr></thead>
          <tbody>
            ${filtered.map(u => `
              <tr>
                <td><b>${escapeHtmlAdmin(u.name)}</b>${u.workplace ? `<div class="text-sm text-muted">${escapeHtmlAdmin(u.workplace)}</div>` : ''}</td>
                <td>${escapeHtmlAdmin(u.email)}</td>
                <td>${escapeHtmlAdmin(u.phone) || '<span class="text-sm text-muted">-</span>'}</td>
                <td>${u.role === 'admin' ? '<span class="tag tag-status-progress">시스템 관리자</span>' : '<span class="tag tag-status-prep">일반 사용자</span>'}</td>
                <td>${renderOrgs(u.organizations)}</td>
                <td class="text-sm text-muted">${fmtDateOnly(u.created_at)}</td>
                <td style="text-align:right;white-space:nowrap;">
                  <button class="btn btn-sm" data-edit="${u.id}">수정</button>
                  ${u.id === me.id ? '' : `<button class="btn btn-sm btn-danger" onclick="delUser(${u.id})">🗑</button>`}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`
        : `<div class="empty"><div class="empty-title">검색 결과가 없습니다</div><div class="empty-sub">다른 키워드로 검색하거나 ✕ 로 지우세요.</div></div>`;
      // Bind edit buttons safely
      document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => {
        const u = _allUsers.find(x => x.id === Number(b.dataset.edit));
        if (u) editUser(u);
      });
    }
    function escapeHtmlAdmin(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function editUser(u) {
      // 전체 기관 목록을 미리 받아두면 모달 안에서 즉시 사용 가능
      let allOrgs = [];
      try {
        const r = await api.get('/api/admin/organizations');
        allOrgs = r.organizations || [];
      } catch { /* 무시 — 빈 목록으로 폴백 */ }

      modal({
        title: '사용자 수정',
        size: 'lg',
        body: `
          <div class="field"><label class="label">이름</label><input class="input" id="u_name" value="${u.name}"></div>
          <div class="field"><label class="label">시스템 권한</label>
            <select class="select" id="u_role">
              <option value="user" ${u.role==='user'?'selected':''}>일반 사용자</option>
              <option value="admin" ${u.role==='admin'?'selected':''}>시스템 관리자</option>
            </select>
          </div>
          <div class="field"><label class="label">새 비밀번호 (변경 시에만 입력)</label><input class="input" id="u_pw" type="password" placeholder="${PASSWORD_POLICY.REQUIREMENTS_TEXT}"></div>

          <div class="field" style="border-top:1px solid var(--border);padding-top:14px;">
            <label class="label">🏛 소속 기관 관리</label>
            <div id="u_orgs_list"></div>
            <div class="flex gap-8 mt-12 items-center" style="background:var(--surface-2);padding:10px;border-radius:8px;flex-wrap:wrap;">
              <select class="select" id="u_org_pick" style="flex:1;min-width:200px;">
                <option value="">— 기관 선택 —</option>
                ${allOrgs.map(o => `<option value="${o.id}">${o.name}</option>`).join('')}
              </select>
              <select class="select" id="u_org_role" style="width:130px;">
                <option value="staff">👤 일반 회원</option>
                <option value="admin">🔑 관리자</option>
              </select>
              <button type="button" class="btn btn-sm" id="u_org_add">+ 추가</button>
            </div>
            <div class="text-sm text-muted mt-8" style="line-height:1.6;">
              ※ 기관별 권한은 즉시 반영됩니다 (저장 버튼 누르지 않아도 됨).
            </div>
          </div>
        `,
        confirmText: '저장',
        onConfirm: async () => {
          const payload = { name: document.getElementById('u_name').value.trim(), role: document.getElementById('u_role').value };
          const pw = document.getElementById('u_pw').value;
          if (pw) {
            const pwErr = PASSWORD_POLICY.validate(pw);
            if (pwErr) { toast(pwErr, 'error'); return false; }
            payload.password = pw;
          }
          try { await api.put(`/api/admin/users/${u.id}`, payload); toast('저장되었습니다.', 'success'); loadUsers(); }
          catch (e) { toast(e.message, 'error'); return false; }
        }
      });
      // 비밀번호 입력 필드에 실시간 정책 체크 부착 (모달이 DOM에 추가된 직후)
      setTimeout(() => attachPasswordPolicy(document.getElementById('u_pw')), 30);

      // 소속 기관 리스트 렌더 + 추가/삭제 핸들러
      function renderUserOrgs() {
        const list = u.organizations || [];
        document.getElementById('u_orgs_list').innerHTML = list.length
          ? list.map(o => `
              <div class="flex items-center justify-between" style="padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;">
                <div>
                  <div class="fw-700 text-sm">${escapeHtml(o.org_name)}</div>
                  <div class="text-sm text-muted">${o.is_owner ? '🏛 소유자 — 자동 관리자' : (o.member_role === 'admin' ? '🔑 관리자' : '👤 일반 회원')}</div>
                </div>
                <div class="flex gap-8">
                  ${!o.is_owner ? `
                    <select class="select u-org-role-sel" data-org="${o.org_id}" style="width:140px;font-size:12.5px;">
                      <option value="staff" ${o.member_role==='staff'?'selected':''}>👤 일반 회원</option>
                      <option value="admin" ${o.member_role==='admin'?'selected':''}>🔑 관리자</option>
                    </select>
                    <button type="button" class="btn btn-sm btn-danger u-org-del" data-org="${o.org_id}">제거</button>
                  ` : '<span class="text-sm text-muted">소유자 권한 자동 유지</span>'}
                </div>
              </div>`).join('')
          : '<div class="text-sm text-muted" style="padding:10px;text-align:center;">소속된 기관이 없습니다.</div>';

        // 권한 select 변경 → 즉시 반영
        document.querySelectorAll('.u-org-role-sel').forEach(sel => {
          sel.onchange = async () => {
            const orgId = Number(sel.dataset.org);
            const role = sel.value;
            try {
              await api.post(`/api/admin/users/${u.id}/orgs`, { org_id: orgId, member_role: role });
              const target = (u.organizations || []).find(x => x.org_id === orgId);
              if (target) target.member_role = role;
              toast('권한이 변경되었습니다.', 'success');
              renderUserOrgs();
            } catch (e) { toast(e.message, 'error'); }
          };
        });
        // 제거 버튼
        document.querySelectorAll('.u-org-del').forEach(btn => {
          btn.onclick = async () => {
            const orgId = Number(btn.dataset.org);
            const target = (u.organizations || []).find(x => x.org_id === orgId);
            if (!target) return;
            confirmDialog(
              `<b>${escapeHtml(target.org_name)}</b> 에서 이 사용자를 제거하시겠습니까?`,
              async () => {
                try {
                  await api.del(`/api/admin/users/${u.id}/orgs/${orgId}`);
                  u.organizations = (u.organizations || []).filter(x => x.org_id !== orgId);
                  toast('제거되었습니다.', 'success');
                  renderUserOrgs();
                } catch (e) { toast(e.message, 'error'); }
              }
            );
          };
        });
      }
      renderUserOrgs();

      // 추가 버튼 핸들러
      document.getElementById('u_org_add').onclick = async () => {
        const orgId = Number(document.getElementById('u_org_pick').value);
        const role = document.getElementById('u_org_role').value;
        if (!orgId) { toast('기관을 선택하세요.', 'error'); return; }
        const orgInfo = allOrgs.find(o => o.id === orgId);
        try {
          await api.post(`/api/admin/users/${u.id}/orgs`, { org_id: orgId, member_role: role });
          // u.organizations 갱신
          u.organizations = u.organizations || [];
          const idx = u.organizations.findIndex(x => x.org_id === orgId);
          const entry = {
            org_id: orgId,
            org_name: orgInfo?.name || '',
            member_role: role,
            is_owner: orgInfo?.owner_id === u.id ? 1 : 0
          };
          if (idx >= 0) u.organizations[idx] = entry;
          else u.organizations.push(entry);
          toast('소속 기관이 추가되었습니다.', 'success');
          document.getElementById('u_org_pick').value = '';
          renderUserOrgs();
        } catch (e) { toast(e.message, 'error'); }
      };
    }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function delUser(id) {
      confirmDialog('이 사용자를 삭제하시겠습니까? 이 사용자가 소유한 기관은 그대로 유지됩니다.', async () => {
        try { await api.del(`/api/admin/users/${id}`); toast('삭제되었습니다.', 'success'); loadUsers(); }
        catch (e) { toast(e.message, 'error'); return false; }
      });
    }

    let _orgsCache = [];
    async function loadOrgs() {
      const { organizations } = await api.get('/api/admin/organizations');
      _orgsCache = organizations;
      document.getElementById('orgCount').textContent = `(총 ${organizations.length}개)`;
      const platformDomain = window.PLATFORM_DOMAIN || 'smartmeet.co.kr';
      const domainCell = (o) => {
        const sub = o.subdomain ? `<a href="https://${o.subdomain}.${platformDomain}" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600;">${o.subdomain}.${platformDomain}</a>` : '<span class="text-sm text-muted">미설정</span>';
        const cust = o.custom_domain ? `<div class="text-sm" style="margin-top:4px;"><a href="https://${o.custom_domain}" target="_blank" style="color:var(--accent);">${o.custom_domain}</a></div>` : '';
        return sub + cust;
      };
      document.getElementById('orgsList').innerHTML = `
        <table class="table">
          <thead><tr><th>기관명</th><th>소유자</th><th>도메인</th><th>회의</th><th>의원</th><th>등록일</th><th style="text-align:right;">작업</th></tr></thead>
          <tbody>
            ${organizations.map(o => `
              <tr>
                <td><b>${o.name}</b></td>
                <td>${o.owner_name || '-'}<div class="text-sm text-muted">${o.owner_email||''}</div></td>
                <td>${domainCell(o)}</td>
                <td>${o.meeting_count}건</td>
                <td>${o.member_count}명</td>
                <td class="text-sm text-muted">${fmtDateOnly(o.created_at)}</td>
                <td style="text-align:right;white-space:nowrap;">
                  <a class="btn btn-sm" href="/organization?id=${o.id}">진입</a>
                  <button class="btn btn-sm" onclick="editOrgDomain(${o.id})">🌐 도메인</button>
                  <button class="btn btn-sm btn-danger" onclick="delOrg(${o.id})">🗑</button>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>`;
    }
    function delOrg(id) {
      confirmDialog('기관과 모든 데이터를 삭제하시겠습니까? 되돌릴 수 없습니다.', async () => {
        try { await api.del(`/api/organizations/${id}`); toast('삭제되었습니다.', 'success'); loadOrgs(); }
        catch (e) { toast(e.message, 'error'); return false; }
      });
    }

    function editOrgDomain(id) {
      const o = _orgsCache.find(x => x.id === id);
      if (!o) return;
      const platformDomain = window.PLATFORM_DOMAIN || 'smartmeet.co.kr';
      modal({
        title: `🌐 도메인 설정 — ${o.name}`,
        size: 'lg',
        body: `
          <div class="text-sm text-muted mb-16">
            서브도메인 또는 자체 도메인을 설정하면 사용자가 해당 주소로 접속 시 이 기관 홈으로 자동 이동됩니다.
          </div>
          <div class="field">
            <label class="label">서브도메인 <span class="text-sm text-muted">(${platformDomain} 의 하위)</span></label>
            <div class="flex gap-8 items-center">
              <input class="input" id="domSub" value="${(o.subdomain||'').replace(/"/g,'&quot;')}" placeholder="예: ksitm" style="flex:0 0 180px;text-align:right;">
              <span style="color:var(--text-muted);">.${platformDomain}</span>
            </div>
            <div class="text-sm text-muted mt-8">영문 소문자·숫자·하이픈만 사용 (2~30자). 비우면 서브도메인 미사용.</div>
          </div>
          <div class="field">
            <label class="label">자체 도메인 <span class="text-sm text-muted">(선택)</span></label>
            <input class="input" id="domCustom" value="${(o.custom_domain||'').replace(/"/g,'&quot;')}" placeholder="예: kistem.or.kr">
            <div class="text-sm text-muted mt-8">기관 자체 도메인을 사용할 경우. DNS 에 CNAME 등록 + Railway 에 도메인 추가 필요.</div>
          </div>
          <div style="background:var(--surface-2);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:13px;">
            <div class="fw-700 mb-8">📌 도메인 설정 후 추가로 필요한 작업</div>
            <ol style="margin:0;padding-left:20px;color:var(--text-muted);">
              <li>Railway 대시보드 → Settings → Networking 에서 도메인 등록 (서브도메인은 와일드카드 1번이면 됨)</li>
              <li>도메인 등록업체에서 CNAME DNS 레코드 추가</li>
              <li>SSL 자동 발급 대기 (5~30분)</li>
            </ol>
          </div>
        `,
        confirmText: '저장',
        onConfirm: async () => {
          const subdomain = document.getElementById('domSub').value.trim();
          const custom_domain = document.getElementById('domCustom').value.trim();
          try {
            await api.put(`/api/organizations/${id}/domain`, { subdomain, custom_domain });
            toast('도메인 설정이 저장되었습니다.', 'success');
            loadOrgs();
          } catch (e) {
            toast(e.message || '저장 실패', 'error');
            return false;
          }
        }
      });
    }

    // SMTP 진단 모달
    async function openSmtpDiag() {
      let status;
      try {
        status = await api.get('/api/admin/smtp-status');
      } catch (e) {
        toast('SMTP 상태 조회 실패: ' + e.message, 'error');
        return;
      }
      const env = status.env_summary;
      const ok = status.enabled;
      modal({
        title: '📧 이메일 발송 진단 (Resend)',
        size: 'lg',
        body: `
          <div class="text-sm text-muted mb-12">현재 환경변수 상태와 발송 테스트를 진행할 수 있습니다.</div>
          <div style="background:${ok ? 'rgba(16,185,129,0.1)' : 'rgba(239,68,68,0.1)'};color:${ok ? '#047857' : '#b91c1c'};padding:14px;border-radius:8px;margin-bottom:16px;font-weight:600;">
            ${ok ? '✅ Resend 활성 (RESEND_API_KEY 설정됨)' : '❌ Resend 비활성 (RESEND_API_KEY 미설정)'}
          </div>

          <div class="card-title mb-8" style="font-size:13px;">환경변수</div>
          <table class="table" style="font-size:13px;margin-bottom:16px;">
            <tbody>
              ${Object.entries(env).map(([k, v]) => `
                <tr>
                  <td style="width:160px;color:var(--text-muted);font-family:monospace;">${k}</td>
                  <td style="font-family:monospace;${v ? '' : 'color:#ef4444;'}">${v || '(미설정)'}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>

          <div class="card-title mb-8" style="font-size:13px;">발신자 (From)</div>
          <table class="table" style="font-size:13px;margin-bottom:16px;">
            <tbody>
              <tr><td style="color:var(--text-muted);">사용 값</td><td style="font-family:monospace;">${status.computed.from}</td></tr>
            </tbody>
          </table>

          ${status.key_diagnostic ? `
          <div class="card-title mb-8" style="font-size:13px;">🔬 API Key 상세 진단</div>
          <table class="table" style="font-size:13px;margin-bottom:16px;">
            <tbody>
              <tr><td style="color:var(--text-muted);">길이</td><td style="font-family:monospace;${status.key_diagnostic.length < 30 || status.key_diagnostic.length > 60 ? 'color:#ef4444;' : 'color:#10b981;'}">${status.key_diagnostic.length}자 ${status.key_diagnostic.length < 30 ? '⚠️ 너무 짧음' : status.key_diagnostic.length > 60 ? '⚠️ 너무 김' : '✓'}</td></tr>
              <tr><td style="color:var(--text-muted);">시작값 (prefix)</td><td style="font-family:monospace;">${status.key_diagnostic.prefix}</td></tr>
              <tr><td style="color:var(--text-muted);">끝값 (suffix)</td><td style="font-family:monospace;">${status.key_diagnostic.suffix}</td></tr>
              <tr><td style="color:var(--text-muted);">'re_' 로 시작?</td><td>${status.key_diagnostic.starts_with_re_ ? '✅ 예' : '❌ 아니오 (잘못된 키)'}</td></tr>
              <tr><td style="color:var(--text-muted);">앞 공백 있음?</td><td>${status.key_diagnostic.has_leading_space ? '❌ 있음 (제거 필요)' : '✅ 없음'}</td></tr>
              <tr><td style="color:var(--text-muted);">뒤 공백 있음?</td><td>${status.key_diagnostic.has_trailing_space ? '❌ 있음 (제거 필요)' : '✅ 없음'}</td></tr>
              <tr><td style="color:var(--text-muted);">줄바꿈 포함?</td><td>${status.key_diagnostic.has_newline ? '❌ 있음 (한 줄로 입력)' : '✅ 없음'}</td></tr>
              <tr><td style="color:var(--text-muted);">따옴표 포함?</td><td>${status.key_diagnostic.has_quotes ? '❌ 있음 (따옴표 제거)' : '✅ 없음'}</td></tr>
            </tbody>
          </table>
          <button type="button" class="btn btn-block mb-12" onclick="checkKey()">🔬 API Key 를 Resend 에 직접 검증</button>
          <div id="key_check_result" style="margin-bottom:12px;"></div>
          ` : ''}

          <div class="field">
            <label class="label">테스트 메일 수신자</label>
            <input class="input" id="smtp_test_to" type="email" placeholder="your-email@example.com" value="${(window._lastSmtpTestTo||'').replace(/"/g,'&quot;')}">
          </div>
          <button type="button" class="btn btn-primary btn-block" id="smtp_test_btn" ${ok ? '' : 'disabled'}>📨 테스트 메일 발송</button>
          <div id="smtp_test_result" style="margin-top:12px;"></div>
        `,
        confirmText: '닫기',
        onConfirm: () => {}
      });
      setTimeout(() => {
        // API Key 직접 검증 버튼
        window.checkKey = async () => {
          const result = document.getElementById('key_check_result');
          if (result) result.innerHTML = '<div class="text-sm text-muted">검증 중...</div>';
          try {
            const r = await api.post('/api/admin/smtp-test-key', {});
            if (r.ok) {
              result.innerHTML = `
                <div style="background:rgba(16,185,129,0.1);color:#047857;padding:12px;border-radius:8px;">
                  <div class="fw-700">✅ API Key 유효 (Resend 인증 OK)</div>
                  <div class="text-sm mt-8">발송 실패는 다른 원인입니다 — From 도메인 미검증, 수신자 제한 등.</div>
                  <div class="text-sm" style="font-family:monospace;color:#475569;">HTTP ${r.http_status}</div>
                </div>`;
            } else {
              result.innerHTML = `
                <div style="background:rgba(239,68,68,0.1);color:#b91c1c;padding:12px;border-radius:8px;">
                  <div class="fw-700">❌ API Key 무효 (Resend 거부)</div>
                  <div class="text-sm mt-8">새 키 발급이 필요합니다.</div>
                  <div class="text-sm" style="font-family:monospace;background:#fff;padding:8px;border-radius:4px;margin-top:6px;">HTTP ${r.http_status}<br>${JSON.stringify(r.response, null, 2)}</div>
                </div>`;
            }
          } catch (e) {
            result.innerHTML = `<div style="background:rgba(239,68,68,0.1);color:#b91c1c;padding:12px;border-radius:8px;">검증 실패: ${e.message}</div>`;
          }
        };

        const btn = document.getElementById('smtp_test_btn');
        if (!btn) return;
        btn.onclick = async () => {
          const to = document.getElementById('smtp_test_to').value.trim();
          const result = document.getElementById('smtp_test_result');
          if (!to) { result.innerHTML = '<div style="color:#ef4444;">수신자를 입력하세요.</div>'; return; }
          window._lastSmtpTestTo = to;
          btn.disabled = true;
          btn.textContent = '발송 중...';
          result.innerHTML = '';
          try {
            await api.post('/api/admin/smtp-test', { to });
            result.innerHTML = `
              <div style="background:rgba(16,185,129,0.1);color:#047857;padding:12px;border-radius:8px;">
                ✅ 발송 성공! ${to} 의 받은편지함을 확인하세요. (스팸함도 함께)
              </div>`;
          } catch (e) {
            // 서버에서 자세한 에러 정보 (code, command, response) 포함
            let detail = '';
            try { const err = JSON.parse(e.message); detail = err; } catch {}
            result.innerHTML = `
              <div style="background:rgba(239,68,68,0.1);color:#b91c1c;padding:12px;border-radius:8px;">
                <div class="fw-700">❌ 발송 실패</div>
                <div style="margin-top:6px;font-family:monospace;font-size:12px;white-space:pre-wrap;">${e.message}</div>
              </div>`;
          } finally {
            btn.disabled = false;
            btn.textContent = '📨 테스트 메일 발송';
          }
        };
      }, 50);
    }
  </script>
</body>
</html>
