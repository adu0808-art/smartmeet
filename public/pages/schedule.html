<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주요 일정 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
      <div class="topbar">
        <div class="topbar-title">주요 일정</div>
        <div class="topbar-actions" id="userArea"></div>
      </div>
      <div class="content">
        <div class="page-header">
          <div>
            <h1 class="page-title">기관 주요 일정</h1>
            <div class="page-sub">목록 또는 달력으로 일정을 확인할 수 있습니다.</div>
          </div>
          <div class="topbar-actions">
            <div class="tabs" style="margin:0;padding:4px;">
              <div class="tab active" data-view="list">📋 목록</div>
              <div class="tab" data-view="calendar">🗓 달력</div>
            </div>
            <button class="btn btn-primary" id="addBtn">+ 일정 추가</button>
          </div>
        </div>

        <div id="listView"></div>

        <div id="calendarView" class="hidden">
          <div class="calendar">
            <div class="calendar-head">
              <button class="btn" id="prevMonth">◀ 이전</button>
              <div class="calendar-title" id="calTitle">-</div>
              <button class="btn" id="nextMonth">다음 ▶</button>
            </div>
            <div class="calendar-grid" id="calGrid"></div>
            <div class="text-sm text-muted mt-12 text-right">
              날짜 셀을 클릭하면 해당 날짜로 일정을 추가할 수 있습니다.
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    const orgId = qs('org');
    let schedules = [], organization;
    let view = 'list';
    const today = new Date();
    let calYear = today.getFullYear(), calMonth = today.getMonth();

    (async function init() {
      const me = await requireAuth();
      document.getElementById('userArea').innerHTML = renderUserChip(me);
      const o = await api.get(`/api/organizations/${orgId}`);
      organization = o.organization;
      renderOrgSidebar(organization, 'schedule');
      document.getElementById('addBtn').onclick = () => openForm();
      document.querySelectorAll('[data-view]').forEach(t => t.onclick = () => switchView(t.dataset.view));
      document.getElementById('prevMonth').onclick = () => { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderCalendar(); };
      document.getElementById('nextMonth').onclick = () => { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderCalendar(); };
      load();
    })();

    function switchView(v) {
      view = v;
      document.querySelectorAll('[data-view]').forEach(t => t.classList.toggle('active', t.dataset.view === v));
      document.getElementById('listView').classList.toggle('hidden', v !== 'list');
      document.getElementById('calendarView').classList.toggle('hidden', v !== 'calendar');
      if (v === 'calendar') renderCalendar();
    }

    async function load() {
      const data = await api.get(`/api/schedules/${orgId}`);
      schedules = data.schedules;
      renderList();
      if (view === 'calendar') renderCalendar();
    }

    // 일정의 상태 계산 — 다일 일정은 [start, end] 사이에 오늘이 들어오면 '오늘 진행 중'
    function statusOf(s, todayStr) {
      const start = s.schedule_date;
      const end = s.end_date || s.schedule_date;
      if (todayStr > end) return 'past';
      if (todayStr < start) return 'future';
      return 'today';
    }

    function renderList() {
      const list = document.getElementById('listView');
      if (!schedules.length) {
        list.innerHTML = `<div class="empty"><div class="empty-title">등록된 일정이 없습니다</div><div class="empty-sub">‘+ 일정 추가’ 버튼으로 일정을 등록하세요.</div></div>`;
        return;
      }
      const todayStr = new Date().toISOString().slice(0, 10);
      list.innerHTML = schedules.map(s => {
        const stat = statusOf(s, todayStr);
        const tag = stat === 'past' ? '<span class="tag tag-status-done">지난 일정</span>'
                  : stat === 'today' ? '<span class="tag tag-status-progress">오늘 진행 중</span>'
                  : '<span class="tag tag-status-prep">예정</span>';
        // 날짜 표시 — 단일이면 1줄, 다일이면 시작 ~ 종료
        const startShort = s.schedule_date.slice(5).replace('-','/');
        const endShort = s.end_date ? s.end_date.slice(5).replace('-','/') : '';
        const dateNum = s.end_date && s.end_date !== s.schedule_date
          ? `<div class="num" style="font-size:11px;line-height:1.4;">${startShort}<br>~<br>${endShort}</div>`
          : `<div class="num" style="font-size:13px;">${startShort}</div>`;
        const dateLabel = s.end_date && s.end_date !== s.schedule_date
          ? `<span style="font-size:11.5px;color:var(--text-muted);margin-left:6px;">📅 ${s.schedule_date} ~ ${s.end_date}</span>` : '';
        return `
          <div class="agenda-item">
            <div class="agenda-no">
              <div class="small">DATE</div>
              ${dateNum}
            </div>
            <div class="agenda-body">
              <div class="agenda-title">${tag} ${s.title}${dateLabel}</div>
              <div class="agenda-summary">${s.description || ''}</div>
            </div>
            <div class="agenda-actions">
              <button class="btn btn-sm" onclick='openForm(${JSON.stringify(s)})'>수정</button>
              <button class="btn btn-sm btn-danger" onclick="del(${s.id})">🗑</button>
            </div>
          </div>`;
      }).join('');
    }

    function renderCalendar() {
      document.getElementById('calTitle').textContent = `${calYear}년 ${calMonth + 1}월`;
      const first = new Date(calYear, calMonth, 1);
      const startDow = first.getDay();
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const prevMonthDays = new Date(calYear, calMonth, 0).getDate();
      const todayStr = new Date().toISOString().slice(0, 10);

      const dows = ['일','월','화','수','목','금','토'];
      const grid = document.getElementById('calGrid');
      let html = dows.map((d, i) => `<div class="cal-dow ${i===0?'sun':''}${i===6?'sat':''}">${d}</div>`).join('');

      const totalCells = Math.ceil((startDow + daysInMonth) / 7) * 7;
      for (let i = 0; i < totalCells; i++) {
        let day, year, month, muted = false;
        if (i < startDow) {
          muted = true;
          day = prevMonthDays - startDow + 1 + i;
          month = calMonth - 1; year = calYear;
          if (month < 0) { month = 11; year--; }
        } else if (i >= startDow + daysInMonth) {
          muted = true;
          day = i - startDow - daysInMonth + 1;
          month = calMonth + 1; year = calYear;
          if (month > 11) { month = 0; year++; }
        } else {
          day = i - startDow + 1;
          month = calMonth; year = calYear;
        }
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const dow = i % 7;
        const isToday = dateStr === todayStr;
        // 이 날짜에 걸치는 모든 이벤트 — schedule_date <= dateStr <= (end_date || schedule_date)
        const events = schedules.filter(s => {
          const start = s.schedule_date;
          const end = s.end_date || s.schedule_date;
          return start <= dateStr && dateStr <= end;
        });
        html += `
          <div class="cal-cell ${muted?'muted':''} ${isToday?'today':''}" onclick="onCellClick('${dateStr}')">
            <div class="cal-day ${dow===0?'sun':''}${dow===6?'sat':''}">${day}</div>
            ${events.map(e => {
              const start = e.schedule_date;
              const end = e.end_date || e.schedule_date;
              // 진행/지남/예정 상태
              const cls = todayStr > end ? 'past' : (todayStr >= start && todayStr <= end) ? 'today' : '';
              // 다일 일정에서 위치 표시 — 첫날/중간/마지막
              const isMulti = e.end_date && e.end_date !== e.schedule_date;
              const posCls = isMulti
                ? (dateStr === start ? ' multi-start' : dateStr === end ? ' multi-end' : ' multi-mid')
                : '';
              const titleLabel = isMulti && dateStr !== start ? '··· ' + e.title : e.title;
              return `<div class="cal-event ${cls}${posCls}" title="${e.title}${isMulti ? ` (${e.schedule_date} ~ ${e.end_date})` : ''}" onclick="event.stopPropagation();openForm(${JSON.stringify(e).replace(/"/g,'&quot;')})">${titleLabel}</div>`;
            }).join('')}
          </div>`;
      }
      grid.innerHTML = html;
    }

    function onCellClick(date) { openForm({ schedule_date: date }); }

    function openForm(s) {
      s = s || {};
      modal({
        title: s.id ? '일정 수정' : '일정 추가',
        body: `
          <div class="field"><label class="label">일정명 *</label><input class="input" id="sd_t" value="${(s.title||'').replace(/"/g,'&quot;')}"></div>
          <div class="flex gap-12">
            <div class="field flex-1"><label class="label">시작일 *</label><input class="input" id="sd_d" type="date" value="${s.schedule_date||''}"></div>
            <div class="field flex-1"><label class="label">종료일 <span class="text-sm text-muted">(여러 날인 경우)</span></label><input class="input" id="sd_e" type="date" value="${s.end_date||''}"></div>
          </div>
          <div class="field"><label class="label">설명</label><textarea class="textarea" id="sd_desc">${s.description||''}</textarea></div>
          <div class="text-sm text-muted" style="background:var(--surface-2);padding:8px 10px;border-radius:6px;line-height:1.6;">
            💡 시작일과 다른 날짜의 종료일을 입력하면 달력에 여러 날에 걸쳐 표시됩니다.
          </div>
        `,
        confirmText: '저장',
        onConfirm: async () => {
          const payload = {
            title: document.getElementById('sd_t').value.trim(),
            schedule_date: document.getElementById('sd_d').value,
            end_date: document.getElementById('sd_e').value || '',
            description: document.getElementById('sd_desc').value
          };
          if (!payload.title || !payload.schedule_date) { toast('필수값을 입력하세요.', 'error'); return false; }
          try { if (s.id) await api.put(`/api/schedules/${s.id}`, payload); else await api.post(`/api/schedules/${orgId}`, payload); toast('저장되었습니다.', 'success'); load(); }
          catch (e) { toast(e.message, 'error'); return false; }
        }
      });
    }

    function del(id) {
      confirmDialog('삭제하시겠습니까?', async () => {
        try { await api.del(`/api/schedules/${id}`); toast('삭제되었습니다.', 'success'); load(); }
        catch (e) { toast(e.message, 'error'); return false; }
      });
    }
  </script>
</body>
</html>
