<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회의 참석 응답 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .rsvp-card {
      max-width: 480px;
      margin: 24px auto;
      padding: 24px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .rsvp-meeting-info {
      background: linear-gradient(135deg, #0f2c5c, #1e40af);
      color: #fff;
      padding: 22px 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .rsvp-org { font-size: 13px; color: #fbbf24; letter-spacing: 1px; margin-bottom: 6px; }
    .rsvp-title { font-size: 20px; font-weight: 800; margin: 6px 0; line-height: 1.4; }
    .rsvp-meta { font-size: 13px; color: #dbeafe; margin-top: 8px; line-height: 1.7; }
    .rsvp-greet { font-size: 14px; margin: 16px 0 8px; color: var(--text); }
    .rsvp-greet b { color: var(--accent); }
    .rsvp-buttons { display: flex; gap: 10px; margin-top: 18px; }
    .rsvp-buttons .btn {
      flex: 1;
      padding: 16px 8px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .rsvp-btn-yes { background: #10b981; color: #fff; }
    .rsvp-btn-yes:hover { background: #059669; transform: translateY(-1px); }
    .rsvp-btn-no { background: #fff; color: #ef4444; border-color: #ef4444; }
    .rsvp-btn-no:hover { background: #fef2f2; transform: translateY(-1px); }
    .rsvp-status-box {
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .rsvp-status-attending { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .rsvp-status-declined  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .rsvp-msg-box {
      background: #f9fafb;
      padding: 12px 14px;
      border-radius: 8px;
      margin: 12px 0;
      border-left: 3px solid #fbbf24;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
    }
    .rsvp-result-icon { font-size: 64px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="rsvp-card" id="root">
    <div style="text-align:center;padding:40px 0;color:var(--text-muted);">불러오는 중...</div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const token = qs('token');
    let payload = null;

    (async function init() {
      if (!token) return showError('잘못된 링크입니다. 토큰이 없습니다.');
      try {
        const r = await fetch(`/api/rsvp/by-token/${token}`);
        const data = await r.json();
        if (!r.ok) return showError(data.error || '응답 페이지를 불러올 수 없습니다.');
        payload = data;
        render();
      } catch (e) { showError('네트워크 오류가 발생했습니다.'); }
    })();

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmtMeetingDate(s) {
      if (!s) return '';
      const d = new Date(s);
      if (isNaN(d.getTime())) return s;
      const pad = n => String(n).padStart(2, '0');
      const days = ['일','월','화','수','목','금','토'];
      return `${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 (${days[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showError(msg) {
      document.getElementById('root').innerHTML = `
        <div style="text-align:center;padding:40px 0;">
          <div class="rsvp-result-icon">⚠️</div>
          <div style="font-weight:700;font-size:16px;margin:12px 0 4px;">오류</div>
          <div style="color:var(--text-muted);">${escapeHtml(msg)}</div>
        </div>`;
    }

    function meetingHeader() {
      const { meeting, organization } = payload;
      return `
        <div class="rsvp-meeting-info">
          <div class="rsvp-org">${escapeHtml(organization?.name || '')}</div>
          <div class="rsvp-title">${escapeHtml(meeting.title || '')}</div>
          <div class="rsvp-meta">
            ${meeting.meeting_date ? `📅 ${escapeHtml(fmtMeetingDate(meeting.meeting_date))}` : ''}
            ${meeting.location ? `<br>📍 ${escapeHtml(meeting.location)}` : ''}
          </div>
        </div>`;
    }

    // 단일 화면 렌더 — 응답 전후 모두 같은 레이아웃, 상태만 인라인으로 갱신
    function render() {
      const { member, meeting } = payload;
      const root = document.getElementById('root');
      const customMsg = (meeting.invitation_message || '').trim();
      const status = member.rsvp_status;            // 'attending' | 'declined' | null
      const hasResponded = status === 'attending' || status === 'declined';
      const isYes = status === 'attending';

      // 응답 상태 배너 (응답 후에만 표시)
      let banner = '';
      if (hasResponded) {
        let note = '';
        if (isYes) {
          if (member._proxyConflict) {
            note = `<div style="font-size:12px;color:#991b1b;background:#fff;padding:8px 10px;border-radius:6px;margin-top:10px;line-height:1.6;border:1px solid #fecaca;">⚠️ 이미 위임장이 제출된 상태입니다. 관리자에게 문의해 주세요.</div>`;
          } else if (member._autoMarked) {
            note = `<div style="font-size:12px;color:#065f46;background:#fff;padding:8px 10px;border-radius:6px;margin-top:10px;line-height:1.6;border:1px solid #a7f3d0;">✓ 회의 출석부에 자동 등록되었습니다.</div>`;
          }
        }
        banner = `
          <div class="rsvp-status-box ${isYes ? 'rsvp-status-attending' : 'rsvp-status-declined'}">
            <div style="font-size:36px;line-height:1;margin-bottom:6px;">${isYes ? '✅' : '❌'}</div>
            <div><b>${isYes ? '참석' : '불참'}</b> 으로 응답하셨습니다.</div>
            ${member.rsvp_at ? `<div style="font-size:12px;opacity:0.75;margin-top:4px;">응답 시각: ${escapeHtml(member.rsvp_at)}</div>` : ''}
            ${note}
          </div>
        `;
      }

      // 버튼 — 현재 응답한 쪽은 "현재 응답" 라벨 + disabled, 반대편은 변경 가능
      const yesActive = status === 'attending';
      const noActive  = status === 'declined';
      const yesBtnStyle = yesActive ? 'opacity:1;box-shadow:0 0 0 3px rgba(16,185,129,0.25);' : '';
      const noBtnStyle  = noActive  ? 'opacity:1;box-shadow:0 0 0 3px rgba(239,68,68,0.25);'  : '';

      root.innerHTML = `
        ${meetingHeader()}
        <div class="rsvp-greet">안녕하세요, <b>${escapeHtml(member.name)}</b> 님.</div>
        ${customMsg ? `<div class="rsvp-msg-box">${escapeHtml(customMsg).replace(/\n/g,'<br>')}</div>` : ''}
        ${banner}
        <div style="text-align:center;font-size:14px;color:var(--text);margin:${hasResponded ? '8px' : '16px'} 0 8px;font-weight:600;">
          ${hasResponded ? '응답을 변경하시려면 다른 버튼을 눌러주세요.' : '참석 여부를 알려주세요'}
        </div>
        <div class="rsvp-buttons">
          <button class="btn rsvp-btn-yes" ${yesActive ? 'disabled' : ''} style="${yesBtnStyle}" onclick="submitResponse('attending')">
            ✅ 참석${yesActive ? ' <span style="font-size:11px;font-weight:600;opacity:0.85;">(현재 응답)</span>' : ''}
          </button>
          <button class="btn rsvp-btn-no"  ${noActive  ? 'disabled' : ''} style="${noBtnStyle}"  onclick="submitResponse('declined')">
            ❌ 불참${noActive ? ' <span style="font-size:11px;font-weight:600;opacity:0.85;">(현재 응답)</span>' : ''}
          </button>
        </div>
        <div style="font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:14px;line-height:1.6;">
          ※ "참석" 응답 시 회의 출석부에 자동 등록됩니다.<br>
          응답 후에도 다시 변경할 수 있습니다.
        </div>
      `;
    }

    let submitting = false;
    async function submitResponse(status) {
      if (submitting) return;
      submitting = true;
      // 버튼 임시 비활성화 (응답 중)
      document.querySelectorAll('.rsvp-buttons .btn').forEach(b => { b.disabled = true; b.style.opacity = '0.6'; });
      try {
        const r = await fetch(`/api/rsvp/respond/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '응답 저장에 실패했습니다.');
        // payload 의 의원 상태를 갱신하고 같은 화면 재렌더 — 페이지 전환 없음
        payload.member.rsvp_status = status;
        payload.member.rsvp_at = new Date().toLocaleString('sv-SE');
        payload.member._autoMarked   = !!data.autoMarked;
        payload.member._proxyConflict = !!data.proxyConflict;
        render();
      } catch (e) {
        if (typeof toast === 'function') toast(e.message, 'error');
        else alert(e.message);
        document.querySelectorAll('.rsvp-buttons .btn').forEach(b => { b.disabled = false; b.style.opacity = ''; });
      } finally {
        submitting = false;
      }
    }
  </script>
</body>
</html>
