<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회의 참석 응답 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .rsvp-card {
      max-width: 480px;
      margin: 24px auto;
      padding: 24px;
      background: var(--surface);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }
    .rsvp-meeting-info {
      background: linear-gradient(135deg, #0f2c5c, #1e40af);
      color: #fff;
      padding: 22px 18px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }
    .rsvp-org { font-size: 13px; color: #fbbf24; letter-spacing: 1px; margin-bottom: 6px; }
    .rsvp-title { font-size: 20px; font-weight: 800; margin: 6px 0; line-height: 1.4; }
    .rsvp-meta { font-size: 13px; color: #dbeafe; margin-top: 8px; line-height: 1.7; }
    .rsvp-greet { font-size: 14px; margin: 16px 0 8px; color: var(--text); }
    .rsvp-greet b { color: var(--accent); }
    .rsvp-buttons { display: flex; gap: 10px; margin-top: 18px; }
    .rsvp-buttons .btn {
      flex: 1;
      padding: 16px 8px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s ease;
    }
    .rsvp-btn-yes { background: #10b981; color: #fff; }
    .rsvp-btn-yes:hover { background: #059669; transform: translateY(-1px); }
    .rsvp-btn-no { background: #fff; color: #ef4444; border-color: #ef4444; }
    .rsvp-btn-no:hover { background: #fef2f2; transform: translateY(-1px); }
    .rsvp-status-box {
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      margin: 16px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .rsvp-status-attending { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .rsvp-status-declined  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .rsvp-msg-box {
      background: #f9fafb;
      padding: 12px 14px;
      border-radius: 8px;
      margin: 12px 0;
      border-left: 3px solid #fbbf24;
      font-size: 13px;
      line-height: 1.6;
      color: var(--text-muted);
    }
    .rsvp-result-icon { font-size: 64px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="rsvp-card" id="root">
    <div style="text-align:center;padding:40px 0;color:var(--text-muted);">불러오는 중...</div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const token = qs('token');
    let payload = null;

    (async function init() {
      if (!token) return showError('잘못된 링크입니다. 토큰이 없습니다.');
      try {
        const r = await fetch(`/api/rsvp/by-token/${token}`);
        const data = await r.json();
        if (!r.ok) return showError(data.error || '응답 페이지를 불러올 수 없습니다.');
        payload = data;
        render();
      } catch (e) { showError('네트워크 오류가 발생했습니다.'); }
    })();

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function fmtMeetingDate(s) {
      if (!s) return '';
      const d = new Date(s);
      if (isNaN(d.getTime())) return s;
      const pad = n => String(n).padStart(2, '0');
      const days = ['일','월','화','수','목','금','토'];
      return `${d.getFullYear()}년 ${pad(d.getMonth()+1)}월 ${pad(d.getDate())}일 (${days[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function showError(msg) {
      document.getElementById('root').innerHTML = `
        <div style="text-align:center;padding:40px 0;">
          <div class="rsvp-result-icon">⚠️</div>
          <div style="font-weight:700;font-size:16px;margin:12px 0 4px;">오류</div>
          <div style="color:var(--text-muted);">${escapeHtml(msg)}</div>
        </div>`;
    }

    function meetingHeader() {
      const { meeting, organization } = payload;
      return `
        <div class="rsvp-meeting-info">
          <div class="rsvp-org">${escapeHtml(organization?.name || '')}</div>
          <div class="rsvp-title">${escapeHtml(meeting.title || '')}</div>
          <div class="rsvp-meta">
            ${meeting.meeting_date ? `📅 ${escapeHtml(fmtMeetingDate(meeting.meeting_date))}` : ''}
            ${meeting.location ? `<br>📍 ${escapeHtml(meeting.location)}` : ''}
          </div>
        </div>`;
    }

    function render() {
      const { member, meeting } = payload;
      const root = document.getElementById('root');

      // 이미 응답한 경우 — 현재 상태 + 변경 옵션
      if (member.rsvp_status === 'attending' || member.rsvp_status === 'declined') {
        const isYes = member.rsvp_status === 'attending';
        root.innerHTML = `
          ${meetingHeader()}
          <div class="rsvp-greet">안녕하세요, <b>${escapeHtml(member.name)}</b> 님.</div>
          <div class="rsvp-status-box ${isYes ? 'rsvp-status-attending' : 'rsvp-status-declined'}">
            <div class="rsvp-result-icon">${isYes ? '✅' : '❌'}</div>
            <b>${isYes ? '참석' : '불참'}</b> 으로 응답하셨습니다.
            ${member.rsvp_at ? `<div style="font-size:12px;color:var(--text-muted);margin-top:6px;">응답 시각: ${escapeHtml(member.rsvp_at)}</div>` : ''}
          </div>
          <div style="text-align:center;font-size:13px;color:var(--text-muted);margin:14px 0 8px;">
            응답을 변경하시려면 다른 버튼을 눌러주세요.
          </div>
          <div class="rsvp-buttons">
            <button class="btn rsvp-btn-yes" ${isYes ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''} onclick="submitResponse('attending')">✅ 참석</button>
            <button class="btn rsvp-btn-no"  ${!isYes ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''} onclick="submitResponse('declined')">❌ 불참</button>
          </div>
        `;
        return;
      }

      // 첫 응답
      const customMsg = (meeting.invitation_message || '').trim();
      root.innerHTML = `
        ${meetingHeader()}
        <div class="rsvp-greet">안녕하세요, <b>${escapeHtml(member.name)}</b> 님.</div>
        ${customMsg ? `<div class="rsvp-msg-box">${escapeHtml(customMsg).replace(/\n/g,'<br>')}</div>` : ''}
        <div style="text-align:center;font-size:14px;color:var(--text);margin:16px 0 4px;font-weight:600;">
          참석 여부를 알려주세요
        </div>
        <div class="rsvp-buttons">
          <button class="btn rsvp-btn-yes" onclick="submitResponse('attending')">✅ 참석</button>
          <button class="btn rsvp-btn-no"  onclick="submitResponse('declined')">❌ 불참</button>
        </div>
        <div style="font-size:11.5px;color:var(--text-muted);text-align:center;margin-top:14px;line-height:1.6;">
          ※ "참석" 응답 시 회의 출석부에 자동 등록됩니다.<br>
          응답 후에도 다시 변경할 수 있습니다.
        </div>
      `;
    }

    let submitting = false;
    async function submitResponse(status) {
      if (submitting) return;
      submitting = true;
      // 버튼 비활성
      document.querySelectorAll('.rsvp-buttons .btn').forEach(b => { b.disabled = true; b.style.opacity = '0.6'; });
      try {
        const r = await fetch(`/api/rsvp/respond/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || '응답 저장에 실패했습니다.');
        showResultPage(status, data);
      } catch (e) {
        if (typeof toast === 'function') toast(e.message, 'error');
        else alert(e.message);
        submitting = false;
        document.querySelectorAll('.rsvp-buttons .btn').forEach(b => { b.disabled = false; b.style.opacity = ''; });
      }
    }

    function showResultPage(status, data) {
      const root = document.getElementById('root');
      const isYes = status === 'attending';
      let extraNote = '';
      if (isYes) {
        if (data.proxyConflict) {
          extraNote = `<div style="font-size:12px;color:#ef4444;background:#fef2f2;padding:10px;border-radius:6px;margin-top:12px;line-height:1.6;">⚠️ 이미 위임장이 제출된 상태로 확인되었습니다. 회의 관리자에게 문의해 주세요.</div>`;
        } else if (data.autoMarked) {
          extraNote = `<div style="font-size:12.5px;color:#065f46;background:#ecfdf5;padding:10px;border-radius:6px;margin-top:12px;line-height:1.6;">✓ 회의 출석부에 자동으로 등록되었습니다.</div>`;
        }
      }
      root.innerHTML = `
        ${meetingHeader()}
        <div style="text-align:center;padding:24px 0 12px;">
          <div class="rsvp-result-icon">${isYes ? '🎉' : '🙏'}</div>
          <div style="font-weight:800;font-size:20px;margin:10px 0 4px;color:${isYes ? '#10b981' : '#64748b'};">
            ${isYes ? '참석 응답해 주셔서 감사합니다' : '응답해 주셔서 감사합니다'}
          </div>
          <div style="font-size:14px;color:var(--text-muted);">
            ${isYes ? '회의에서 뵙겠습니다.' : '다음에 뵐 수 있기를 바랍니다.'}
          </div>
          ${extraNote}
        </div>
        <div style="text-align:center;margin-top:14px;">
          <button class="btn" onclick="location.reload()" style="font-size:13px;">응답 변경하기</button>
        </div>
      `;
    }
  </script>
</body>
</html>
