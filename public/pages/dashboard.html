<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기관 목록 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    /* 카드/목록 뷰 토글 */
    .view-toggle {
      display: inline-flex;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
    }
    .view-toggle .vt-btn {
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .view-toggle .vt-btn.active { background: var(--accent); color: #fff; }
    .view-toggle .vt-btn:not(.active):hover { background: var(--surface-2); color: var(--text); }

    /* 목록(테이블) 뷰 */
    .org-list-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .org-list-table th {
      background: var(--surface-2);
      padding: 12px 14px;
      text-align: left;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .org-list-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      vertical-align: middle;
    }
    .org-list-table tr:last-child td { border-bottom: none; }
    .org-list-table tr.row-clickable { cursor: pointer; transition: background 0.12s; }
    .org-list-table tr.row-clickable:hover { background: var(--surface-2); }
    .org-list-name { display: flex; align-items: center; gap: 10px; }
    .org-list-logo {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid; place-items: center;
      font-weight: 700;
      font-size: 12.5px;
      flex-shrink: 0;
      overflow: hidden;
    }
    .org-list-logo img { width: 100%; height: 100%; object-fit: contain; background: white; }
    .org-list-summary { color: var(--text-muted); font-size: 12.5px; max-width: 480px; }
    .org-list-actions { white-space: nowrap; text-align: right; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">SM</div>
        <div>
          <div class="brand-name">SmartMeet</div>
          <div class="brand-sub">이사회·총회 관리</div>
        </div>
      </div>
      <div class="nav-section-title">메뉴</div>
      <a href="/dashboard" class="nav-item active">
        <span class="icon">📋</span> 기관 목록
      </a>
      <a id="adminLink" href="/admin" class="nav-item" style="display:none;">
        <span class="icon">⚙️</span> 관리자
      </a>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar-title">기관 목록</div>
        <div class="topbar-actions" id="userArea"></div>
      </div>

      <div class="content">
        <div class="page-header">
          <div>
            <h1 class="page-title">등록된 기관</h1>
            <div class="page-sub">관리할 기관을 선택하거나 새 기관을 등록하세요.</div>
          </div>
          <div class="topbar-actions" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <div class="view-toggle" id="viewToggle">
              <button class="vt-btn active" data-view="card">📇 카드</button>
              <button class="vt-btn" data-view="list">📋 목록</button>
            </div>
            <button class="btn btn-primary" id="newOrgBtn">+ 기관 등록</button>
          </div>
        </div>

        <div id="orgListWrap"></div>
      </div>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/editor.js"></script>
  <script>
    let me;
    let organizations = [];
    let currentView = localStorage.getItem('orgListView') || 'card';   // 'card' | 'list'

    (async function init() {
      me = await requireAuth();
      if (!me) return;
      document.getElementById('userArea').innerHTML = renderUserChip(me);
      if (me.role === 'admin') document.getElementById('adminLink').style.display = '';
      document.getElementById('newOrgBtn').onclick = openNewOrg;
      // 뷰 토글 버튼
      document.querySelectorAll('#viewToggle .vt-btn').forEach(b => {
        b.onclick = () => {
          currentView = b.dataset.view;
          localStorage.setItem('orgListView', currentView);
          updateViewToggleUI();
          render();
        };
      });
      updateViewToggleUI();
      await load();
    })();

    function updateViewToggleUI() {
      document.querySelectorAll('#viewToggle .vt-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.view === currentView);
      });
    }

    async function load() {
      try {
        const r = await api.get('/api/organizations');
        organizations = r.organizations || [];
      } catch (e) {
        document.getElementById('orgListWrap').innerHTML =
          `<div class="empty"><div class="empty-title">불러오기 실패</div><div class="empty-sub">${escapeHtml(e.message)}</div></div>`;
        return;
      }
      render();
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function summaryOf(o) {
      return (o.summary && o.summary.trim())
        ? o.summary
        : (o.description ? String(o.description).replace(/<[^>]+>/g, '').trim().slice(0, 120) : '');
    }
    function roleBadge(role) {
      return role === 'system_admin' ? '<span class="tag tag-status-progress">시스템</span>'
           : role === 'admin' ? '<span class="tag tag-status-progress">관리자</span>'
           : '<span class="tag tag-status-prep">회원</span>';
    }
    function canEdit(role) { return role === 'admin' || role === 'system_admin'; }

    function render() {
      const root = document.getElementById('orgListWrap');
      if (!organizations.length) {
        root.className = '';
        root.innerHTML = `
          <div class="empty">
            <div class="empty-title">등록된 기관이 없습니다</div>
            <div class="empty-sub">우측 상단의 ‘기관 등록’ 버튼으로 시작하세요.</div>
          </div>`;
        return;
      }
      if (currentView === 'card') renderCards(root);
      else renderList(root);
    }

    function renderCards(root) {
      root.className = 'grid-cards';
      root.innerHTML = organizations.map(o => {
        const role = o.my_role;
        const logoSrc = pickLogo(o, 'logo');
        const logoCell = logoSrc
          ? `<div class="org-card-logo" style="background:white;border:1px solid var(--border);overflow:hidden;"><img src="${logoSrc}" style="width:100%;height:100%;object-fit:contain;background:white;"></div>`
          : `<div class="org-card-logo">${logoText(o.name)}</div>`;
        const summaryText = summaryOf(o) || '개요가 등록되지 않았습니다.';
        return `
        <div class="org-card" onclick="goOrg(${o.id})">
          <div class="org-card-head">
            ${logoCell}
            <div style="flex:1;">
              <div class="org-card-name">${escapeHtml(o.name)}</div>
              ${o.owner_name ? `<div class="text-sm text-muted">${escapeHtml(o.owner_name)}</div>` : ''}
            </div>
            ${roleBadge(role)}
          </div>
          <div class="org-card-desc">${escapeHtml(summaryText)}</div>
          <div class="org-card-stats" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;gap:14px;">
              <div>이벤트 <b>${o.meeting_count || 0}</b>건</div>
              <div>구성원 <b>${o.member_count || 0}</b>명</div>
            </div>
            ${canEdit(role) ? `<button class="btn btn-sm" onclick="event.stopPropagation();openEditOrg(${o.id})">✏️ 정보 수정</button>` : ''}
          </div>
        </div>`;
      }).join('');
    }

    function renderList(root) {
      root.className = '';
      root.innerHTML = `
        <table class="org-list-table">
          <thead>
            <tr>
              <th style="width:36%;">기관명</th>
              <th>개요</th>
              <th style="width:80px;">권한</th>
              <th style="width:90px;text-align:center;">이벤트</th>
              <th style="width:90px;text-align:center;">구성원</th>
              <th style="width:140px;text-align:right;">작업</th>
            </tr>
          </thead>
          <tbody>
            ${organizations.map(o => {
              const role = o.my_role;
              const logoSrc = pickLogo(o, 'logo');
              const logoCell = logoSrc
                ? `<div class="org-list-logo"><img src="${logoSrc}" alt=""></div>`
                : `<div class="org-list-logo">${logoText(o.name)}</div>`;
              const summaryText = summaryOf(o) || '<span class="text-muted">개요 없음</span>';
              return `
              <tr class="row-clickable" onclick="goOrg(${o.id})">
                <td>
                  <div class="org-list-name">
                    ${logoCell}
                    <div>
                      <div style="font-weight:700;">${escapeHtml(o.name)}</div>
                      ${o.owner_name ? `<div class="text-sm text-muted">${escapeHtml(o.owner_name)}</div>` : ''}
                    </div>
                  </div>
                </td>
                <td><div class="org-list-summary">${typeof summaryText === 'string' && summaryText.startsWith('<') ? summaryText : escapeHtml(summaryText)}</div></td>
                <td>${roleBadge(role)}</td>
                <td style="text-align:center;"><b>${o.meeting_count || 0}</b></td>
                <td style="text-align:center;"><b>${o.member_count || 0}</b></td>
                <td class="org-list-actions" onclick="event.stopPropagation();">
                  <button class="btn btn-sm" onclick="goOrg(${o.id})">열기 →</button>
                  ${canEdit(role) ? `<button class="btn btn-sm" onclick="openEditOrg(${o.id})">✏️ 수정</button>` : ''}
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

    function goOrg(id) { location.href = `/home?org=${id}`; }

    // ====== 기관 등록 ======
    function openNewOrg() {
      const logoState = { logo_url: '', logo_text_url: '', logo_combo_url: '' };
      const heroState = { hero_image_url: '' };
      modal({
        title: '기관 등록',
        size: 'lg',
        body: `
          <div class="field"><label class="label">기관명 *</label><input class="input" id="m_name" placeholder="예: 연세대학교 공학동창회" /></div>
          <div class="field">
            <label class="label">개요</label>
            <div class="text-sm text-muted mb-8">한 줄로 짧게 기관을 소개하세요. 기관 목록 카드에 표시됩니다.</div>
            <textarea class="input" id="m_summary" rows="2" placeholder="예: 1980년 설립, 회원 800여 명의 산업·학술 협력 단체"></textarea>
          </div>
          ${heroImageHtml('ne', '')}
          <div class="label" style="margin-bottom:6px;">기관 로고 (3종)</div>
          ${logoSlotsHtml('ne', logoState)}
          <div class="text-sm text-muted mt-12" style="background:var(--surface-2);padding:10px 12px;border-radius:8px;line-height:1.6;">
            💡 자세한 <b>기관 소개</b>와 <b>인사말</b>은 등록 후 기관 홈에서 직접 편집할 수 있습니다.
          </div>
        `,
        confirmText: '등록',
        onConfirm: async () => {
          const name = document.getElementById('m_name').value.trim();
          if (!name) { toast('기관명을 입력하세요.', 'error'); return false; }
          const summary = document.getElementById('m_summary').value.trim();
          const logos = readLogoSlots('ne', logoState);
          const hero_image_url = readHeroImage('ne', heroState);
          try {
            await api.post('/api/organizations', { name, summary, hero_image_url, ...logos });
            toast('기관이 등록되었습니다.', 'success');
            load();
          } catch (e) { toast(e.message, 'error'); return false; }
        }
      });
      setTimeout(() => {
        bindHeroImage('ne', heroState);
        bindLogoSlots('ne', logoState);
      }, 30);
    }

    // ====== 기관 정보 수정 (목록에서 직접 호출) ======
    function openEditOrg(id) {
      const o = organizations.find(x => x.id === id);
      if (!o) { toast('기관 정보를 찾을 수 없습니다.', 'error'); return; }
      const logoState = {
        logo_url:       o.logo_url       || '',
        logo_text_url:  o.logo_text_url  || '',
        logo_combo_url: o.logo_combo_url || ''
      };
      const heroState = { hero_image_url: o.hero_image_url || '' };
      modal({
        title: `기관 정보 수정 — ${o.name}`,
        size: 'lg',
        body: `
          <div class="field"><label class="label">기관명 *</label><input class="input" id="ed_name" value="${escapeHtml(o.name||'')}"></div>
          <div class="field">
            <label class="label">개요</label>
            <div class="text-sm text-muted mb-8">한 줄로 짧게 기관을 소개하세요. 기관 목록 카드에 표시됩니다.</div>
            <textarea class="input" id="ed_summary" rows="2" placeholder="예: 1980년 설립, 회원 800여 명의 산업·학술 협력 단체">${escapeHtml(o.summary||'')}</textarea>
          </div>
          ${heroImageHtml('ed', o.hero_image_url || '')}
          <div class="label" style="margin-bottom:6px;">기관 로고 (3종)</div>
          ${logoSlotsHtml('ed', logoState)}
          <div class="text-sm text-muted mt-12" style="background:var(--surface-2);padding:10px 12px;border-radius:8px;line-height:1.6;">
            💡 <b>기관 소개</b>와 <b>인사말</b>은 기관 홈 페이지의 각 섹션에서 ✏️ 수정 버튼으로 직접 편집하세요.
          </div>
        `,
        confirmText: '저장',
        onConfirm: async () => {
          const name = document.getElementById('ed_name').value.trim();
          if (!name) { toast('기관명을 입력하세요.', 'error'); return false; }
          const logos = readLogoSlots('ed', logoState);
          const hero_image_url = readHeroImage('ed', heroState);
          try {
            await api.put(`/api/organizations/${id}`, {
              name,
              summary: document.getElementById('ed_summary').value.trim(),
              hero_image_url,
              ...logos
            });
            toast('수정되었습니다.', 'success');
            await load();
          } catch (e) { toast(e.message, 'error'); return false; }
        }
      });
      setTimeout(() => {
        bindHeroImage('ed', heroState);
        bindLogoSlots('ed', logoState);
      }, 30);
    }
    window.openEditOrg = openEditOrg;
  </script>
</body>
</html>
