<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>비밀번호 재설정 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">SM</div>
      <div>
        <div class="auth-brand-name">SmartMeet</div>
        <div class="auth-brand-sub">비밀번호 재설정</div>
      </div>
    </div>

    <h1 class="auth-title">새 비밀번호 설정</h1>
    <p class="auth-subtitle">비밀번호 정책을 만족하는 새 비밀번호를 입력하세요.</p>

    <div class="auth-error" id="err"></div>
    <div id="successBox" style="display:none;background:rgba(16,185,129,0.1);color:#047857;padding:14px;border-radius:8px;margin-bottom:16px;text-align:center;">
      ✅ 비밀번호가 성공적으로 변경되었습니다.<br>
      <a href="/login" style="color:#047857;font-weight:700;">로그인 페이지로 이동</a>
    </div>

    <form id="resetForm">
      <div class="field">
        <label class="label">새 비밀번호 *</label>
        <input class="input" type="password" id="newPw" placeholder="8자 이상, 영문 대/소문자·숫자·특수문자 포함" required autocomplete="new-password" />
      </div>
      <div class="field">
        <label class="label">비밀번호 확인 *</label>
        <input class="input" type="password" id="newPw2" placeholder="다시 입력" required autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">비밀번호 변경</button>
    </form>

    <div class="auth-foot">
      <a href="/login">← 로그인으로 돌아가기</a>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const token = qs('token');
    if (!token) {
      const err = document.getElementById('err');
      err.textContent = '유효하지 않은 접근입니다. 비밀번호 찾기를 다시 시도해주세요.';
      err.classList.add('active');
      document.getElementById('resetForm').style.display = 'none';
    }

    // 비밀번호 정책 실시간 표시
    attachPasswordPolicy(document.getElementById('newPw'));

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.classList.remove('active');
      const nw = document.getElementById('newPw').value;
      const nw2 = document.getElementById('newPw2').value;
      const pwErr = PASSWORD_POLICY.validate(nw);
      if (pwErr) { err.textContent = pwErr; err.classList.add('active'); return; }
      if (nw !== nw2) { err.textContent = '비밀번호가 일치하지 않습니다.'; err.classList.add('active'); return; }
      try {
        await api.post('/api/auth/reset-password', { token, new_password: nw });
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('active');
      }
    });
  </script>
</body>
</html>
