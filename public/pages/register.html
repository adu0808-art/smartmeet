<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>회원가입 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">SM</div>
      <div>
        <div class="auth-brand-name">SmartMeet</div>
        <div class="auth-brand-sub">이사회·총회 자료 관리 시스템</div>
      </div>
    </div>
    <h1 class="auth-title">회원가입</h1>
    <p class="auth-subtitle" id="subtitle">기관을 등록하고 회의를 시작해보세요.</p>

    <div id="invitePreview" class="card mb-16" style="display:none;background:var(--accent-soft);border-color:var(--accent);"></div>

    <div class="auth-error" id="err"></div>
    <form id="registerForm">
      <div class="field">
        <label class="label">이름 *</label>
        <input class="input" type="text" name="name" placeholder="홍길동" required />
      </div>
      <div class="field">
        <label class="label">이메일 *</label>
        <input class="input" type="email" name="email" placeholder="name@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label class="label">전화번호</label>
        <input class="input" type="tel" name="phone" placeholder="010-1234-5678" autocomplete="tel" />
      </div>
      <div class="field">
        <label class="label">소속 (직장·소속 단체)</label>
        <input class="input" type="text" name="workplace" placeholder="예: 한국전자(주)" autocomplete="organization" />
      </div>
      <div class="field">
        <label class="label">비밀번호 *</label>
        <input class="input" type="password" name="password" id="reg_password" placeholder="8자 이상, 영문 대/소문자·숫자·특수문자 포함" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field">
        <label class="label">비밀번호 확인 *</label>
        <input class="input" type="password" name="password2" placeholder="다시 입력" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">계정 만들기</button>
    </form>

    <div class="auth-foot">
      이미 계정이 있으신가요? <a href="/login" id="loginLink">로그인</a>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    const inviteToken = qs('invite');
    const ctxOrgId = Number(qs('org')) || 0;     // 기관 홈에서 가입할 때 자동 소속 지정
    const nextUrl = (function() {
      const n = qs('next');
      return (n && n.startsWith('/') && !n.startsWith('//')) ? n : null;
    })();
    let invitation = null;
    let ctxOrg = null;       // ?org= 로 들어왔을 때의 기관 정보 (이름 등)

    (async function init() {
      if (inviteToken) {
        try {
          const r = await fetch(`/api/invitations/by-token/${inviteToken}`);
          const data = await r.json();
          if (!r.ok) throw new Error(data.error);
          invitation = data.invitation;
          document.getElementById('subtitle').textContent = `${invitation.organization_name}의 신규 회원으로 가입합니다.`;
          renderInvitePreview();
        } catch (e) {
          document.getElementById('err').textContent = '초대 링크 오류: ' + e.message;
          document.getElementById('err').classList.add('active');
        }
      }
      // ?org= 컨텍스트 — 초대 토큰 없이도 기관 정보를 보여주고 자동 소속 지정
      if (!inviteToken && ctxOrgId) {
        try {
          const r = await fetch(`/api/public/home/${ctxOrgId}`);
          const data = await r.json();
          if (r.ok && data.organization) {
            ctxOrg = data.organization;
            document.getElementById('subtitle').textContent = `${ctxOrg.name}의 회원으로 가입합니다.`;
            renderOrgPreview();
          }
        } catch (e) { /* 무시 — 일반 가입으로 fallback */ }
      }
      // Already logged in?
      const u = await getMe();
      if (u && !inviteToken && !ctxOrgId) {
        // No invite + no org ctx — already-logged-in user goes to their workspace
        return smartRedirect(u);
      }
      if (u && inviteToken && invitation) {
        // Logged in + invite link: still show signup form, but offer "join with current account"
        const banner = document.createElement('div');
        banner.className = 'card mb-16';
        banner.style.cssText = 'background:var(--info-soft);border-color:var(--info);font-size:13px;color:var(--info);';
        banner.innerHTML = `
          현재 <b>${u.name}</b>님으로 로그인되어 있습니다.
          <div class="flex gap-8 mt-8">
            <button type="button" class="btn btn-sm" id="joinBtn">${u.name} 계정으로 가입</button>
            <button type="button" class="btn btn-sm" id="logoutBtn">로그아웃 후 새 계정 만들기</button>
          </div>
        `;
        const inviteCard = document.getElementById('invitePreview');
        inviteCard.parentNode.insertBefore(banner, inviteCard.nextSibling);
        document.getElementById('joinBtn').onclick = doJoin;
        document.getElementById('logoutBtn').onclick = async () => {
          await api.post('/api/auth/logout');
          location.reload();
        };
      }
    })();

    function renderInvitePreview() {
      const p = document.getElementById('invitePreview');
      p.style.display = 'block';
      p.innerHTML = `
        <div class="flex items-center gap-12">
          <div class="auth-logo" style="background:var(--accent);width:36px;height:36px;font-size:14px;">${(invitation.organization_name||'?').slice(0,2)}</div>
          <div>
            <div class="text-sm text-muted">초대된 기관</div>
            <div class="fw-700">${invitation.organization_name}</div>
            <div class="text-sm">기본 권한: ${invitation.default_role === 'admin' ? '🔑 관리자' : '👤 일반 사용자'}</div>
          </div>
        </div>
      `;
    }

    function renderOrgPreview() {
      if (!ctxOrg) return;
      const p = document.getElementById('invitePreview');
      p.style.display = 'block';
      const initials = (ctxOrg.name || '?').slice(0, 2);
      p.innerHTML = `
        <div class="flex items-center gap-12">
          <div class="auth-logo" style="background:var(--accent);width:36px;height:36px;font-size:14px;">${initials}</div>
          <div>
            <div class="text-sm text-muted">소속 기관</div>
            <div class="fw-700">${ctxOrg.name || ''}</div>
            <div class="text-sm" style="color:var(--text-muted);">가입 후 자동으로 회원으로 등록됩니다.</div>
          </div>
        </div>
      `;
    }

    async function doJoin() {
      try {
        const r = await api.post('/api/auth/join', { invite_token: inviteToken });
        toast('가입되었습니다!', 'success');
        setTimeout(() => location.href = `/home?org=${r.organization_id}`, 700);
      } catch (e) { toast(e.message, 'error'); }
    }

    // 비밀번호 입력 시 실시간 정책 체크 UI 표시
    attachPasswordPolicy(document.getElementById('reg_password'));

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById('err');
      err.classList.remove('active');
      // 비밀번호 정책 검증
      const pwErr = PASSWORD_POLICY.validate(fd.get('password'));
      if (pwErr) {
        err.textContent = pwErr;
        err.classList.add('active');
        return;
      }
      if (fd.get('password') !== fd.get('password2')) {
        err.textContent = '비밀번호가 일치하지 않습니다.';
        err.classList.add('active');
        return;
      }
      try {
        const r = await api.post('/api/auth/register-request', {
          name: fd.get('name'),
          email: fd.get('email'),
          phone: fd.get('phone') || '',
          workplace: fd.get('workplace') || '',
          password: fd.get('password'),
          invite_token: inviteToken || undefined,
          org_id: !inviteToken && ctxOrgId ? ctxOrgId : undefined
        });
        // 인증 메일 발송 완료 — 안내 화면으로 전환
        showVerificationSent(r.email || fd.get('email'));
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('active');
        // 이미 가입된 이메일이면 로그인 링크 안내
        if (ex.message && ex.message.includes('이미 등록된')) {
          const inviteParam = inviteToken ? `?invite=${inviteToken}` : (ctxOrgId ? `?org=${ctxOrgId}` : '');
          const nextParam = '/register' + inviteParam;
          err.innerHTML = ex.message + ` <a href="/login?next=${encodeURIComponent(nextParam)}" style="color:#1e40af;text-decoration:underline;">로그인 →</a>`;
        }
      }
    });

    // 인증 메일 발송 완료 화면
    function showVerificationSent(email) {
      const card = document.querySelector('.auth-card');
      if (!card) return;
      card.innerHTML = `
        <div style="text-align:center;padding:30px 8px;">
          <div style="font-size:64px;margin-bottom:12px;">📩</div>
          <h1 style="font-size:22px;font-weight:800;margin:8px 0 12px;color:#0f2c5c;">이메일을 확인해주세요</h1>
          <p style="font-size:15px;color:#374151;line-height:1.7;margin:0 0 18px;">
            <b>${escapeHtmlReg(email)}</b> 로<br>
            인증 메일을 발송했습니다.
          </p>
          <div style="background:#eef2ff;border-left:3px solid #6366f1;padding:14px 16px;border-radius:8px;text-align:left;margin:0 0 18px;font-size:13.5px;line-height:1.7;color:#3730a3;">
            메일의 <b>"이메일 인증하고 가입 완료"</b> 버튼을 클릭하시면<br>
            회원가입이 자동으로 완료됩니다.<br>
            <span style="color:#6b7280;font-size:12px;">※ 이 링크는 1시간 동안만 유효합니다.</span>
          </div>
          <div style="font-size:13px;color:var(--text-muted);line-height:1.7;">
            메일이 안 오면 스팸함을 확인해주세요.<br>
            여전히 안 오면 잠시 후 다시 시도해주세요.
          </div>
          <a class="btn" href="/login" style="margin-top:18px;display:inline-block;text-decoration:none;">로그인 페이지로</a>
        </div>
      `;
    }
    function escapeHtmlReg(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  </script>
</body>
</html>
