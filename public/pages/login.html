<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">SM</div>
      <div>
        <div class="auth-brand-name">SmartMeet</div>
        <div class="auth-brand-sub">이사회·총회 자료 관리 시스템</div>
      </div>
    </div>
    <h1 class="auth-title">로그인</h1>
    <p class="auth-subtitle">회의 운영을 더 빠르고 정확하게.</p>

    <div class="auth-error" id="err"></div>
    <form id="loginForm">
      <div class="field">
        <label class="label">이메일</label>
        <input class="input" type="email" name="email" placeholder="name@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label class="label">비밀번호</label>
        <input class="input" type="password" name="password" placeholder="6자 이상" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">로그인</button>
    </form>

    <div class="auth-foot" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <span>아직 계정이 없으신가요? <a href="/register">회원가입</a></span>
      <span>
        <a href="javascript:void(0)" onclick="openFindId()">아이디 찾기</a>
        ·
        <a href="javascript:void(0)" onclick="openForgotPassword()">비밀번호 찾기</a>
      </span>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    // ?next=/path 으로 로그인 후 이동할 URL 지정 가능
    function getNextUrl() {
      const next = new URLSearchParams(location.search).get('next');
      // 같은 도메인 내부 경로만 허용 (open-redirect 방지)
      return (next && next.startsWith('/') && !next.startsWith('//')) ? next : null;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById('err');
      err.classList.remove('active');
      try {
        const data = await api.post('/api/auth/login', { email: fd.get('email'), password: fd.get('password') });
        const next = getNextUrl();
        if (next) location.href = next;
        else smartRedirect(data.user);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('active');
      }
    });
    getMe().then(u => {
      if (!u) return;
      const next = getNextUrl();
      if (next) location.href = next;
      else smartRedirect(u);
    });

    // === 아이디 찾기 모달 ===
    function openFindId() {
      modal({
        title: '🔍 아이디 (이메일) 찾기',
        body: `
          <div class="text-sm text-muted mb-16">가입 시 등록한 이름과 전화번호를 입력하세요.</div>
          <div class="field"><label class="label">이름</label>
            <input class="input" id="fid_name" placeholder="홍길동">
          </div>
          <div class="field"><label class="label">전화번호</label>
            <input class="input" id="fid_phone" placeholder="010-1234-5678">
          </div>
          <div id="fid_result" style="display:none;background:var(--surface-2);padding:14px;border-radius:8px;margin-top:8px;text-align:center;"></div>
        `,
        confirmText: '찾기',
        onConfirm: async () => {
          const name = document.getElementById('fid_name').value.trim();
          const phone = document.getElementById('fid_phone').value.trim();
          if (!name || !phone) { toast('이름과 전화번호를 모두 입력하세요.', 'error'); return false; }
          try {
            const r = await api.post('/api/auth/find-id', { name, phone });
            const result = document.getElementById('fid_result');
            result.style.display = 'block';
            result.innerHTML = `
              <div class="text-sm text-muted mb-8">등록된 이메일 (보안상 일부 마스킹):</div>
              <div style="font-size:18px;font-weight:700;color:var(--accent);">${r.email}</div>
            `;
            return false;  // 모달 닫지 않음
          } catch (e) { toast(e.message, 'error'); return false; }
        }
      });
    }

    // === 비밀번호 찾기 모달 ===
    function openForgotPassword() {
      modal({
        title: '🔑 비밀번호 재설정',
        body: `
          <div class="text-sm text-muted mb-16">가입한 이메일을 입력하시면 비밀번호 재설정 링크를 발송합니다.</div>
          <div class="field"><label class="label">이메일</label>
            <input class="input" id="fp_email" type="email" placeholder="name@example.com" autocomplete="email">
          </div>
          <div class="text-sm text-muted">메일이 안 오면 스팸함을 확인하세요. 1시간 동안만 유효합니다.</div>
          <div id="fp_result" style="display:none;padding:12px;border-radius:8px;margin-top:12px;"></div>
        `,
        confirmText: '재설정 링크 발송',
        onConfirm: async () => {
          const email = document.getElementById('fp_email').value.trim();
          if (!email) { toast('이메일을 입력하세요.', 'error'); return false; }
          try {
            const r = await api.post('/api/auth/forgot-password', { email });
            const result = document.getElementById('fp_result');
            result.style.display = 'block';
            if (r.sent === false && r.message) {
              result.innerHTML = `<div style="background:rgba(245,158,11,0.1);color:#92400e;">${r.message}</div>`;
            } else {
              result.innerHTML = `<div style="background:rgba(16,185,129,0.1);color:#047857;">📧 입력하신 이메일로 비밀번호 재설정 링크를 발송했습니다.<br>이메일이 등록되지 않은 경우 발송되지 않을 수 있습니다.</div>`;
            }
            return false;
          } catch (e) { toast(e.message, 'error'); return false; }
        }
      });
    }
  </script>
</body>
</html>
