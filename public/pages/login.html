<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 · SmartMeet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">SM</div>
      <div>
        <div class="auth-brand-name">SmartMeet</div>
        <div class="auth-brand-sub">이사회·총회 자료 관리 시스템</div>
      </div>
    </div>
    <h1 class="auth-title">로그인</h1>
    <p class="auth-subtitle">회의 운영을 더 빠르고 정확하게.</p>

    <div class="auth-error" id="err"></div>
    <form id="loginForm">
      <div class="field">
        <label class="label">이메일</label>
        <input class="input" type="email" name="email" placeholder="name@example.com" required autocomplete="email" />
      </div>
      <div class="field">
        <label class="label">비밀번호</label>
        <input class="input" type="password" name="password" placeholder="6자 이상" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">로그인</button>
    </form>

    <div class="auth-foot">
      아직 계정이 없으신가요? <a href="/register">회원가입</a>
    </div>
    <div class="auth-foot" style="margin-top:8px;font-size:11px;">
      관리자: admin@smartmeet.local / admin1234
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script>
    // ?next=/path 으로 로그인 후 이동할 URL 지정 가능
    function getNextUrl() {
      const next = new URLSearchParams(location.search).get('next');
      // 같은 도메인 내부 경로만 허용 (open-redirect 방지)
      return (next && next.startsWith('/') && !next.startsWith('//')) ? next : null;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById('err');
      err.classList.remove('active');
      try {
        const data = await api.post('/api/auth/login', { email: fd.get('email'), password: fd.get('password') });
        const next = getNextUrl();
        if (next) location.href = next;
        else smartRedirect(data.user);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('active');
      }
    });
    getMe().then(u => {
      if (!u) return;
      const next = getNextUrl();
      if (next) location.href = next;
      else smartRedirect(u);
    });
  </script>
</body>
</html>
